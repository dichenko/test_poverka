services:
  db:
    image: postgres:16-alpine
    container_name: poverka-bot-max-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maxapp}
      POSTGRES_USER: ${POSTGRES_USER:-maxuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maxuser} -d ${POSTGRES_DB:-maxapp}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:9.13
    container_name: poverka-bot-max-pgadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change_me}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  backend:
    build:
      context: ./backend
    container_name: poverka-bot-max-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgres://maxuser:change_me@db:5432/maxapp}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:3000}
      MINIAPP_PUBLIC_URL: ${MINIAPP_PUBLIC_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-replace_me_with_very_long_secret_32_chars_min}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-max_refresh_token}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-replace_me}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-replace_me}
      MAX_BOT_API_BASE_URL: ${MAX_BOT_API_BASE_URL:-https://botapi.max.ru}
      MAX_INITDATA_TTL_SECONDS: ${MAX_INITDATA_TTL_SECONDS:-300}
      INITDATA_REPLAY_TTL_SECONDS: ${INITDATA_REPLAY_TTL_SECONDS:-600}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-120}
      AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-20}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-./storage}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-http://localhost:3000/static}
      PHOTO_WORKER_POLL_INTERVAL_MS: ${PHOTO_WORKER_POLL_INTERVAL_MS:-5000}
      PHOTO_ORIGINAL_DIR: ${PHOTO_ORIGINAL_DIR:-/app/storage/photos/original}
      PHOTO_COMPRESSED_DIR: ${PHOTO_COMPRESSED_DIR:-/app/storage/photos/compressed}
      PUBLIC_FILES_BASE_URL: ${PUBLIC_FILES_BASE_URL:-http://localhost:3000/uploads}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - backend_storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  photo-worker:
    build:
      context: ./backend
    container_name: poverka-bot-max-photo-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "dist/photo-worker.js"]
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgres://maxuser:change_me@db:5432/maxapp}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:3000}
      MINIAPP_PUBLIC_URL: ${MINIAPP_PUBLIC_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-replace_me_with_very_long_secret_32_chars_min}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-max_refresh_token}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-replace_me}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-replace_me}
      MAX_BOT_API_BASE_URL: ${MAX_BOT_API_BASE_URL:-https://botapi.max.ru}
      MAX_INITDATA_TTL_SECONDS: ${MAX_INITDATA_TTL_SECONDS:-300}
      INITDATA_REPLAY_TTL_SECONDS: ${INITDATA_REPLAY_TTL_SECONDS:-600}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-120}
      AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-20}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-./storage}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-http://localhost:3000/static}
      PHOTO_WORKER_POLL_INTERVAL_MS: ${PHOTO_WORKER_POLL_INTERVAL_MS:-5000}
      PHOTO_ORIGINAL_DIR: ${PHOTO_ORIGINAL_DIR:-/app/storage/photos/original}
      PHOTO_COMPRESSED_DIR: ${PHOTO_COMPRESSED_DIR:-/app/storage/photos/compressed}
      PUBLIC_FILES_BASE_URL: ${PUBLIC_FILES_BASE_URL:-http://localhost:3000/uploads}
    volumes:
      - backend_storage:/app/storage

  miniapp:
    build:
      context: ./miniapp
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_DEFAULT_BACKEND_PUBLIC_URL: ${VITE_DEFAULT_BACKEND_PUBLIC_URL:-http://localhost:3000}
    container_name: poverka-bot-max-miniapp
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s

volumes:
  postgres_data:
  pgadmin_data:
  backend_storage:
